<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proposal Activity</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #07060f; color: #f2ecff; font-family: "Courier New", monospace; padding: 24px; }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; color: #ff8fb8; text-shadow: 0 0 14px rgba(255,61,129,.6); }
    .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; color: #9a93b8; font-size: 13px; }
    button { background: rgba(255,255,255,.06); color: #f2ecff; border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-family: inherit; }
    button:hover { border-color: #46e6ff; }
    table { width: 100%; border-collapse: collapse; background: rgba(20,16,40,.6); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,.07); }
    th { color: #46e6ff; font-weight: normal; font-size: 13px; }
    .yes_clicked { color: #5fe6a0; } .maybe_clicked { color: #ffcf5f; } .page_opened { color: #9a93b8; }
    .empty { text-align: center; color: #9a93b8; padding: 24px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Proposal Activity</h1>
    <div class="bar"><span id="count"></span><button id="refresh">Refresh</button></div>
    <table>
      <thead><tr><th>Event</th><th>Time</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script src="admin.js"></script>
</body>
</html>
